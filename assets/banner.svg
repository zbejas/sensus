<?xml version="1.0" encoding="UTF-8"?>
<!--
  README banner: the wordmark plus the block cursor it is never seen without.

  The palette is the site's custom ink theme (site/src/styles/tokens.css) and the
  mono stack mirrors the site's font-mono token, so the wordmark resolves to the
  same face as sensus.sh. textLength pins the six-character advance, which keeps
  the caret flush against the text in any mono fallback (Consolas is narrower
  than the 0.6em norm). GitHub renders the CSS blink when the SVG is embedded as
  an image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="sensus: a terminal you live in">
  <style>
    .caret { animation: blink 1.15s steps(2, start) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="17.25" fill="#11151b" stroke="#2b323d" stroke-width="1.5"/>

  <!-- Wordmark and caret form one centered lockup: 557.3 is the text center,
       764.6 the caret's left edge after the 0.36em gap. -->
  <text x="557.3" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="96" font-weight="600" fill="#e9ecf2" textLength="345.6" lengthAdjust="spacing">sensus</text>
  <rect class="caret" x="764.6" y="75.2" width="50.9" height="89.3" fill="#58c4d8"/>

  <text x="600" y="222" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#9ba4b2">A terminal you live in.</text>
</svg>
